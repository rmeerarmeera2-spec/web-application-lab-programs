<!DOCTYPE html>
<html>
<head>
    <title>Bank Account Dashboard</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #3730a3;
        }

        .card {
            width: 400px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .bank {
            font-size: 50px;
        }

        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #3730a3;
            margin: 20px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 7px;
            background: #3730a3;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function Account(props) {

    const [balance, setBalance] = React.useState(props.amount);

    function deposit() {
        setBalance(balance + 500);
    }

    function withdraw() {
        if (balance >= 500) {
            setBalance(balance - 500);
        }
    }

    return (
        <div className="card">

            <div className="bank">🏦</div>

            <h2>Account Dashboard</h2>

            <p><b>Customer:</b> {props.name}</p>

            <p><b>Account Type:</b> {props.type}</p>

            <div className="balance">
                ₹{balance}
            </div>

            <button onClick={deposit}>
                Deposit ₹500
            </button>

            <button onClick={withdraw}>
                Withdraw ₹500
            </button>

        </div>
    );
}

function App() {

    return (
        <div>

            <h1>Digital Banking Dashboard</h1>

            <Account
                name="Ravena"
                type="Savings Account"
                amount={5000}
            />

        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
