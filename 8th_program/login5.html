<!DOCTYPE html>
<html>
<head>
    <title>Flight Reservation</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #ecfeff;
        }

        .card {
            width: 400px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #0891b2;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0891b2;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
        }

        .ticket {
            margin-top: 20px;
            padding: 15px;
            background: #cffafe;
            border-radius: 8px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function FlightReservation() {

    const [name, setName] = React.useState("");
    const [from, setFrom] = React.useState("Chennai");
    const [to, setTo] = React.useState("Bangalore");
    const [message, setMessage] = React.useState("");

    function reserve(e) {
        e.preventDefault();

        if (name === "") {
            setMessage("Please enter passenger name.");
            return;
        }

        setMessage(
            "Reservation confirmed! Passenger: " +
            name + " | " + from + " → " + to
        );
    }

    return (
        <div className="card">

            <h1>✈️ Flight Reservation</h1>

            <form onSubmit={reserve}>

                <div className="group">
                    <label>Passenger Name</label>
                    <input
                        type="text"
                        placeholder="Enter name"
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                    />
                </div>

                <div className="group">
                    <label>From</label>

                    <select
                        value={from}
                        onChange={(e) => setFrom(e.target.value)}
                    >
                        <option>Chennai</option>
                        <option>Delhi</option>
                        <option>Mumbai</option>
                    </select>
                </div>

                <div className="group">
                    <label>To</label>

                    <select
                        value={to}
                        onChange={(e) => setTo(e.target.value)}
                    >
                        <option>Bangalore</option>
                        <option>Hyderabad</option>
                        <option>Kolkata</option>
                    </select>
                </div>

                <button>Reserve Ticket</button>

            </form>

            {message && <div className="ticket">{message}</div>}

        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root"))
    .render(<FlightReservation />);

</script>

</body>
</html>
