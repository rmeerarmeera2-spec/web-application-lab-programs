<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .app {
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #3730a3;
        }

        .card {
            background: white;
            width: 350px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .icon {
            font-size: 60px;
        }

        .info {
            text-align: left;
            margin: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #3730a3;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function Student() {

    const [show, setShow] = React.useState(false);

    return (
        <div className="card">

            <div className="icon">👩‍🎓</div>

            <h2>Student Profile</h2>

            <p>Welcome to Student Portal</p>

            <button onClick={() => setShow(!show)}>
                {show ? "Hide Profile" : "View Profile"}
            </button>

            {show && (
                <div>
                    <div className="info">Name: Meera</div>
                    <div className="info">Course: M.Sc Computer Science</div>
                    <div className="info">Year: First Year</div>
                    <div className="info">Status: Active Student</div>
                </div>
            )}

        </div>
    );
}

function App() {

    return (
        <div className="app">

            <h1>React Student Portal</h1>

            <Student />

        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
