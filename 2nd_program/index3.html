<!DOCTYPE html>
<html>
<head>
    <title>Restaurant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff8ee;
        }

        header {
            background-color: darkred;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #222;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        nav a:hover {
            color: orange;
        }

        section {
            padding: 20px;
        }

        .menu {
            background-color: white;
            border: 2px solid darkred;
            padding: 15px;
            width: 300px;
        }

        footer {
            background-color: darkred;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>Spice Garden Restaurant</h1>
    <p>Fresh Food, Happy Moments</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
</nav>

<section>
    <h2>Welcome</h2>

    <p>
        We serve delicious and fresh food prepared
        with quality ingredients.
    </p>

    <div class="menu">
        <h3>Today's Menu</h3>
        <ul>
            <li>Veg Fried Rice</li>
            <li>Paneer Biryani</li>
            <li>Masala Dosa</li>
            <li>Fresh Fruit Juice</li>
        </ul>
    </div>
</section>

<footer>
    <p>&copy; 2026 Spice Garden Restaurant</p>
</footer>

</body>
</html>
