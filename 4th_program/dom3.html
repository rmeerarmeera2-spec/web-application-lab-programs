<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Counter App</title>
</head>

<body>

<h2>Counter</h2>

<h1 id="count">0</h1>

<button onclick="increase()">Increase</button>
<button onclick="decrease()">Decrease</button>
<button onclick="reset()">Reset</button>

<script>

let count = 0;

function increase() {
    count++;
    document.getElementById("count").innerHTML = count;
}

function decrease() {
    count--;
    document.getElementById("count").innerHTML = count;
}

function reset() {
    count = 0;
    document.getElementById("count").innerHTML = count;
}

</script>

</body>
</html>
